name: macOS validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Report toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version
      - name: Regression tests including cross-volume file safety
        run: ./scripts/test_cross_volume.sh
      - name: Build and verify Universal ZIP and DMG
        run: ./scripts/package_release.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: DropShelf-Universal-${{ github.sha }}
          path: build/releases/v*/*
          if-no-files-found: error
          retention-days: 14
